<!-- MODALE ASSISTENTE AI PER TAB -->
<div id="modal-ask-ai" class="ai-modal-overlay" style="display: none;">
    <div class="ai-modal-card">
        <!-- HEADER -->
        <div class="ai-modal-header">
            <div class="ai-modal-header-left">
                <span class="ai-modal-icon">✨</span>
                <span class="ai-modal-title">{{ _("Chiedi all'AI") }}</span>
                <div class="ai-context-selector-wrapper">
                    <span class="ai-context-label">{{ _('Contesto:') }}</span>
                    <select id="ai-chat-context-select" onchange="window.cambiaContestoAiChat(this.value)" class="ai-context-select">
                        <option value="vehicles">🚗 {{ _('Vehicles') }}</option>
                        <option value="wallet">💳 {{ _('Wallet') }}</option>
                        <option value="bills">💡 {{ _('Bills') }}</option>
                        <option value="investments">📈 {{ _('Investments') }}</option>
                        <option value="loans">🏦 {{ _('Loans') }}</option>
                        <option value="salaries">💼 {{ _('Salaries') }}</option>
                        <option value="pension">📊 {{ _('Pension Fund') }}</option>
                        <option value="all">🌐 {{ _('Tutti i dati (Generale)') }}</option>
                    </select>
                </div>
            </div>
            <div class="ai-modal-header-right">
                <span id="ai-chat-model-badge" class="ai-chat-badge">⚡ AI</span>
                <button type="button" onclick="window.svuotaChatAi()" class="ai-modal-btn-icon" title="{{ _('Azzera conversazione') }}">🗑️</button>
                <button type="button" onclick="window.chiudiModalAiChat()" class="ai-modal-close" title="{{ _('Chiudi') }}">×</button>
            </div>
        </div>

        <!-- SUGGERIMENTI RAPIDI CHIP -->
        <div id="ai-chat-suggestions" class="ai-suggestions-container"></div>

        <!-- AREA MESSAGGI -->
        <div id="ai-chat-messages" class="ai-messages-container">
            <div class="ai-welcome-box">
                <div class="ai-welcome-icon">🤖</div>
                <div class="ai-welcome-text">
                    <h4>{{ _('Ciao! Sono il tuo assistente finanziario CoTrack.') }}</h4>
                    <p>{{ _('Fammi una domanda sui tuoi dati nel contesto selezionato, oppure clicca su uno dei suggerimenti in alto.') }}</p>
                </div>
            </div>
        </div>

        <!-- INDICATORE DI CARICAMENTO / DIGITAZIONE -->
        <div id="ai-chat-typing" class="ai-typing-indicator" style="display: none;">
            <div class="ai-typing-dots">
                <span></span><span></span><span></span>
            </div>
            <span class="ai-typing-text">{{ _("L'assistente sta analizzando i dati...") }}</span>
        </div>

        <!-- INPUT FOOTER -->
        <div class="ai-modal-footer">
            <label class="ai-sql-toggle" title="{{ _('Interroga direttamente il database: risposte su qualsiasi periodo o dettaglio') }}">
                <input type="checkbox" id="ai-chat-sql-mode" onchange="window.toggleAiSqlMode(this.checked)">
                <span>{{ _('Modalità libera (SQL)') }}</span>
            </label>
            <form id="ai-chat-form" onsubmit="window.inviaDomandaAiForm(event)" class="ai-chat-input-wrapper">
                <textarea id="ai-chat-input" rows="1" placeholder="{{ _('Scrivi una domanda... (es: quanto ho speso in veicoli lo scorso mese?)') }}" onkeydown="window.gestisciInvioAiChat(event)"></textarea>
                <button type="submit" id="ai-chat-send-btn" class="ai-send-btn" title="{{ _('Invia') }}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>
