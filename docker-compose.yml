version: '3.8'

services:
  cotrack:
    build: .
    container_name: cotrack
    ports:
      - "5001:5001"
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_PRIMARY=${GEMINI_MODEL_PRIMARY:-gemini-3.8-flash}
      - GEMINI_MODEL_FALLBACK=${GEMINI_MODEL_FALLBACK:-gemini-3.5-flash-lite}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - SECRET_KEY=${SECRET_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      - DRIVVO_ENABLED=${DRIVVO_ENABLED:-true}
      - DRIVVO_EMAIL=${DRIVVO_EMAIL}
      - DRIVVO_PASSWORD=${DRIVVO_PASSWORD}
      - HASS_WEBHOOK_TOKEN=${HASS_WEBHOOK_TOKEN}
      - WEEKLY_AI_REPORT_ENABLED=${WEEKLY_AI_REPORT_ENABLED:-false}
    volumes:
      # Mappa la sottocartella 'data' dal tuo NAS (che verrà creata automaticamente)
      # alla cartella '/app/data' nel container. In questo modo il database
      # è salvato in modo persistente e separato dal codice dell'applicazione.
      - ./data:/app/data
    restart: always
    stdin_open: true
    tty: true